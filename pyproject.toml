[project]
name = "mediakit"
version = "0.1.0"
description = "Offline desktop toolkit for image, audio and PDF work"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Aybüke", email = "119972157+aybukeKrcvs@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1 ; sys_platform != 'win32'",
    "onnxruntime-directml>=1.24.4 ; sys_platform == 'win32'",
    "pillow>=13.0.0",
    "pyside6>=6.11.1",
]

[project.scripts]
mediakit = "mediakit.app:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
